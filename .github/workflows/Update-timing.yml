name: Update Live Timing

"on":
  schedule:
    # 5 minutes is GitHub Actions' fastest native schedule — it will not
    # run more often than this no matter what cron string you use, and
    # even 5 minutes isn't a hard guarantee (can slip under load).
    # To get closer to ~1-minute updates anyway, each run below loops
    # internally every ~60s for its own 5-minute window, so a new
    # scheduled trigger picks up right as the previous run's loop ends.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed to commit live-timing.json back to the repo

# Prevents two runs from racing to commit/push at the same time if a
# trigger fires while the previous run's loop is still going. Queues
# them instead of running in parallel or canceling either one.
concurrency:
  group: update-live-timing
  cancel-in-progress: false

jobs:
  update-timing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24' # matches where GitHub Actions runners are headed (Node 20 removed Sept 16, 2026)

      - name: Poll LiveRC roughly every 60 seconds for this run's 5-minute window
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3 4 5; do
            echo "--- Poll $i of 5 ---"
            node update-timing.mjs

            git add live-timing.json
            if ! git diff --quiet --cached; then
              # Pull in case a queued run from concurrency already pushed
              # since this run started, then commit and push this update.
              git pull --rebase --autostash
              git commit -m "Update live timing data [skip ci]"
              git push
            else
              echo "No change, skipping commit"
            fi

            if [ "$i" -lt 5 ]; then
              sleep 60
            fi
          done
