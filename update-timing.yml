name: Update Live Timing

"on":
  # Primary trigger: an external cron service (cron-job.org) calls this
  # via the GitHub API every 1-5 minutes. workflow_dispatch is what you
  # already confirmed works reliably — this just automates calling it,
  # bypassing GitHub's own schedule trigger, which was going silent.
  workflow_dispatch: {}
  # Backup only: GitHub's native schedule, kept as a low-frequency
  # safety net in case the external cron service ever has an outage.
  # Not relied on for the real cadence anymore.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write # needed to commit live-timing.json back to the repo

# Prevents two runs (e.g. the external trigger and the backup schedule
# landing close together) from racing to commit/push at the same time.
concurrency:
  group: update-live-timing
  cancel-in-progress: false

jobs:
  update-timing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch latest LiveRC data
        run: node update-timing.mjs

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-timing.json
          if ! git diff --quiet --cached; then
            git pull --rebase --autostash
            git commit -m "Update live timing data [skip ci]"
            git push
          fi
