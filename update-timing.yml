name: Update Live Timing

"on":
  schedule:
    # Every 15 minutes. GitHub Actions cron isn't guaranteed to the
    # minute (can run a few minutes late under load), and GitHub
    # auto-disables scheduled workflows after 60 days with no repo
    # activity — a commit or manual run re-enables it.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed to commit data/live-timing.json back to the repo

jobs:
  update-timing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest LiveRC data
        run: node scripts/update-timing.mjs

      - name: Commit updated data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-timing.json
          git diff --quiet --cached || git commit -m "Update live timing data [skip ci]"
          git push
